<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind the gap</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --text: #0b0b0b;
  --text-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(42,120,214,0.08);
  --bar: #86b6ef;
  --bar-sel: #2a78d6;
  --s1: #2a78d6;
  --s2: #eb6834;
  --neutral: #c3c2b7;
  --top: #cde2fb;
  --warn-bg: #fff4dc;
  --warn-ink: #6b4a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(57,135,229,0.12);
    --bar: #1c5cab; --bar-sel: #5598e7; --s1: #3987e5; --s2: #d95926; --neutral: #52514e;
    --top: #184f95; --warn-bg: #3a2c08; --warn-ink: #fad27a;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --text: #f0efec; --text-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --wash: rgba(57,135,229,0.12);
  --bar: #1c5cab; --bar-sel: #5598e7; --s1: #3987e5; --s2: #d95926; --neutral: #52514e;
  --top: #184f95; --warn-bg: #3a2c08; --warn-ink: #fad27a;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--page); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1240px; margin: 0 auto; padding: 28px 24px 48px; }
header { display: flex; gap: 24px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.01em; }
h1 span { color: var(--s1); }
.lede { margin: 0; color: var(--text-2); max-width: 760px; }
h2 { font-size: 20px; margin: 36px 0 12px; }
h3 { font-size: 16px; margin: 0 0 2px; }
.sub { color: var(--text-2); font-size: 13px; margin: 0 0 14px; }
.controls { display: flex; gap: 10px; align-items: center; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px; }
.seg button {
  font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--text-2);
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--s1); color: #fff; font-weight: 600; }
.iconbtn {
  font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  padding: 6px 10px; border-radius: 8px; cursor: pointer;
}
.selwrap { position: relative; display: inline-block; max-width: 100%; }
.selwrap::after {
  content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; pointer-events: none;
  border-right: 2px solid var(--text-2); border-bottom: 2px solid var(--text-2); transform: translateY(-70%) rotate(45deg);
}
select {
  appearance: none; -webkit-appearance: none; font: inherit; font-size: 15px; font-weight: 600;
  padding: 8px 44px 8px 14px; min-width: 280px; max-width: 100%; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer;
}
select:hover { border-color: var(--axis); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 24px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; min-width: 0; }
.kpi .label { color: var(--text-2); font-size: 13px; }
.kpi .value { font-size: 30px; font-weight: 650; margin: 4px 0 2px; letter-spacing: -0.01em; }
.kpi .note { color: var(--muted); font-size: 13px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid3 { display: grid; grid-template-columns: 1.1fr 1.1fr 1fr; gap: 14px; }
.grid-profile { grid-template-columns: 1.45fr 1fr; margin-top: 14px; }
.grid2 > *, .grid3 > * { min-width: 0; }
.cardhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }

/* ranking */
.rank-list { position: relative; }
.rrow {
  position: absolute; left: 0; right: 0; height: 34px; display: grid;
  grid-template-columns: 28px minmax(120px, 230px) 1fr 64px; align-items: center; gap: 10px;
  transition: transform 700ms cubic-bezier(.2,.8,.2,1); cursor: pointer; border-radius: 6px; padding: 0 4px;
}
.rrow:hover { background: var(--wash); }
.rrow .rk { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 13px; }
.rrow.top .rk { color: var(--text); font-weight: 700; }
.rrow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.rrow.sel .nm { font-weight: 650; }
.track { height: 20px; position: relative; }
.fill {
  height: 100%; background: var(--bar); border-radius: 0 4px 4px 0;
  transition: width 700ms cubic-bezier(.2,.8,.2,1), background 200ms;
}
.rrow.sel .fill { background: var(--bar-sel); }
.rrow .val { font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; color: var(--text-2); }
.rrow.sel .val { color: var(--text); font-weight: 600; }
.callout { margin-top: 14px; padding: 10px 12px; border-left: 3px solid var(--s1); background: var(--wash); border-radius: 0 8px 8px 0; font-size: 14px; }
.hint { color: var(--muted); font-size: 12px; margin-top: 8px; }

/* scatter + slope */
svg { display: block; overflow: visible; }
svg text { fill: var(--text-2); font-size: 12px; font-family: inherit; }
svg .axis-title { fill: var(--muted); font-size: 12px; }
svg .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .gridline { stroke: var(--grid); stroke-width: 1; }
svg .refline { stroke: var(--axis); stroke-width: 1; }
svg .reflabel { fill: var(--muted); font-size: 11px; }
svg .dot { fill: var(--bar); stroke: var(--surface); stroke-width: 2; cursor: pointer; transition: fill 200ms; }
svg .dot.sel { fill: var(--bar-sel); }
svg .dotlabel { fill: var(--text-2); font-size: 12px; pointer-events: none; }
svg .dotlabel.sel { fill: var(--text); font-weight: 650; }
svg .slope { stroke: var(--neutral); stroke-width: 2; fill: none; }
svg .slope.sel { stroke: var(--s1); stroke-width: 3; }
svg .sdot { fill: var(--neutral); stroke: var(--surface); stroke-width: 2; }
svg .sdot.sel { fill: var(--s1); }
svg .slabel.sel { fill: var(--text); font-weight: 650; }
svg .hit { fill: transparent; cursor: pointer; }

/* profile */
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 14px 0 4px; }
.stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
.stat .label { font-size: 12px; color: var(--text-2); }
.stat .value { font-size: 22px; font-weight: 650; }
.warn { margin-top: 10px; padding: 8px 12px; border-radius: 8px; background: var(--warn-bg); color: var(--warn-ink); font-size: 13px; }
.warn::before { content: "⚠ "; }

.hbars { display: grid; gap: 4px; }
.hb { display: grid; grid-template-columns: minmax(0, 46%) 1fr 44px; gap: 10px; align-items: center; min-height: 26px; border-radius: 6px; padding: 1px 4px; }
.hb:hover { background: var(--wash); }
.hb .lab { font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; }
.hb .bar { height: 16px; border-radius: 0 4px 4px 0; transition: width 500ms cubic-bezier(.2,.8,.2,1); }
.hb .num { font-size: 13px; color: var(--text-2); text-align: right; font-variant-numeric: tabular-nums; }
.hb.county { grid-template-columns: 130px 1fr 36px; min-height: 22px; }
.hb.county .bar { height: 14px; background: var(--s1); }

.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin: 0 0 10px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.check { font-size: 13px; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; user-select: none; }
.check input { accent-color: var(--s1); width: 16px; height: 16px; }

/* robustness table */
table.rob { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 2px; font-size: 13px; font-variant-numeric: tabular-nums; }
.rob th { font-weight: 500; hyphens: manual; color: var(--text-2); font-size: 11px; text-align: center; vertical-align: bottom; padding: 0 2px 4px; line-height: 1.2; }
.rob th:first-child { text-align: left; width: 36%; }
.rob td { text-align: center; padding: 3px 0; border-radius: 4px; }
.rob td:first-child { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; }
.rob td.top { background: var(--top); font-weight: 700; color: var(--text); }
.rob tr { cursor: pointer; }
.rob tr.sel td:first-child { font-weight: 650; }
.rob tr:hover td:first-child { color: var(--s1); }

.pr .grp { margin-bottom: 14px; }
.pr .grp > div:first-child { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.pr .hb { grid-template-columns: 120px 1fr 44px; }

.tooltip {
  position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.12); opacity: 0; transition: opacity 120ms; max-width: 280px;
}
.tooltip b { display: block; margin-bottom: 2px; }
.tooltip .row { display: flex; justify-content: space-between; gap: 16px; color: var(--text-2); }
.tooltip .row span:last-child { color: var(--text); font-variant-numeric: tabular-nums; }
footer { margin-top: 36px; color: var(--muted); font-size: 12px; }

@media (max-width: 1240px) {
  .grid3 { grid-template-columns: 1fr 1fr; }
  .grid3 > .pr { grid-column: 1 / -1; }
}
@media (max-width: 980px) {
  .grid2, .grid3, .grid-profile { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .stats { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 560px) {
  .wrap { padding: 20px 16px 40px; }
  .kpis, .stats { grid-template-columns: 1fr 1fr; }
  .rrow { grid-template-columns: 22px 110px 1fr 52px; gap: 6px; }
  .hb.county { grid-template-columns: 100px 1fr 32px; }
}
</style>
</head>

<div class="wrap">
  <header>
    <div>
      <h1>Mind the <span>gap</span></h1>
      <p class="lede" data-t="lede"></p>
    </div>
    <div class="controls">
      <button class="iconbtn" id="themeBtn"></button>
    </div>
  </header>

  <section class="kpis" id="kpis"></section>

        <div class="seg" role="group">
          <button data-mode="ppp" data-t="mode_ppp"></button><button data-mode="raw" data-t="mode_raw"></button>
        </div>
      </div>
      <div class="rank-list" id="rankList"></div>
      <div class="callout" id="rankNote"></div>
      <div class="hint" data-t="hint"></div>

    <div class="card">
      <h3 data-t="sc_title"></h3>
      <p class="sub" data-t="sc_sub"></p>
      <div id="scatter"></div>
    </div>
  </div>

  <h2 data-t="h_profile"></h2>
  <div class="card">
    <div class="cardhead" style="margin-bottom:0">
      <span class="selwrap"><select id="progSelect" aria-label="Programme"></select></span>
    </div>
    <div class="stats" id="stats"></div>
    <div id="warn"></div>
  </div>
  <div class="grid2 grid-profile">
    <div class="card">
      <div class="cardhead" style="margin-bottom:6px">
        <div><h3 data-t="sk_title"></h3><p class="sub" data-t="sk_sub" style="margin:0"></p></div>
        <label class="check"><input type="checkbox" id="onlyEsco"><span data-t="sk_only"></span></label>
      </div>
      <div class="legend" id="skLegend"></div>
      <div class="hbars" id="skills"></div>
    </div>
    <div class="card">
      <h3 data-t="co_title"></h3>
      <p class="sub" id="coSub"></p>
      <div class="hbars" id="counties"></div>
    </div>
  </div>

  <h2 data-t="h_eval"></h2>
  <div class="grid3">
    <div class="card">
      <h3 data-t="sl_title"></h3>
      <p class="sub" data-t="sl_sub"></p>
      <div id="slope"></div>
      <div class="callout" data-t="sl_note"></div>
    </div>
    <div class="card">
      <h3 data-t="rb_title"></h3>
      <p class="sub" data-t="rb_sub"></p>
      <table class="rob" id="rob"></table>
      <div class="callout" data-t="rb_note"></div>
    </div>
    <div class="card pr">
      <h3 data-t="pr_title"></h3>
      <p class="sub" data-t="pr_sub"></p>
      <div class="legend" id="prLegend"></div>
      <div id="pr"></div>
      <div class="callout" data-t="pr_note"></div>
    </div>
  </div>

  <footer data-t="footer"></footer>
</div>

// ---------- state ----------
const params = new URLSearchParams(location.search);

const S = {
  mode: params.get("mode") || "ppp",
  sel: DATA.programmes[0].id,
  onlyEsco: false,
};
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");

const P = DATA.programmes;
const byId = Object.fromEntries(P.map(p => [p.id, p]));
const t = k => T[k];
const name = p => p.en;
const fmt = (v, d = 0) => v.toLocaleString("en-GB", { minimumFractionDigits: d, maximumFractionDigits: d });
const pct = v => `${fmt(v * 100)}%`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const $ = id => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

// ---------- tooltip ----------
const tip = $("tip");
function showTip(ev, title, rows) {
  tip.innerHTML = `<b>${esc(title)}</b>` + rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
  tip.style.opacity = 1;
  moveTip(ev);
}
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.opacity = 0; }
function progTip(ev, p) {
  showTip(ev, name(p), [
    [t("tt_postings"), fmt(p.postings)], [t("tt_places"), fmt(p.places)],
    [t("tt_ppp"), fmt(p.ppp, 2)], [t("tt_app"), fmt(p.applicants, 2)],
  ]);
}
function bindHover(el, fn) {
  el.addEventListener("mouseenter", fn);
  el.addEventListener("mousemove", moveTip);
  el.addEventListener("mouseleave", hideTip);
}

// ---------- static text ----------
function renderText() {
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
  $("themeBtn").textContent = isDark() ? "☀ " + t("theme_light") : "☾ " + t("theme_dark");
}
function isDark() {
  const th = document.documentElement.dataset.theme;
  return th ? th === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}

// ---------- KPIs ----------
function renderKpis() {
  const postings = P.reduce((s, p) => s + p.postings, 0);
  const places = P.reduce((s, p) => s + p.places, 0);
  const top = P[0];
  const ev = DATA.eval.skills;
  const tiles = [
    [t("k_postings"), fmt(postings), t("k_postings_note")],
    [t("k_places"), fmt(places), t("k_places_note")],
    [t("k_top"), name(top), t("k_top_note")(fmt(top.ppp, 2))],
    [t("k_llm"), pct(ev.llm.recall), t("k_llm_note")(pct(ev.baseline.recall))],
  ];
  $("kpis").innerHTML = tiles.map(([l, v, n]) =>
    `<div class="card kpi"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div><div class="note">${esc(n)}</div></div>`).join("");
}

// ---------- ranking ----------
const ROW_H = 36;
function buildRanking() {
  const list = $("rankList");
  list.style.height = P.length * ROW_H + "px";
  P.forEach(p => {
    const row = document.createElement("div");
    row.className = "rrow";
    row.dataset.id = p.id;
    row.innerHTML = `<span class="rk"></span><span class="nm"></span><div class="track"><div class="fill"></div></div><span class="val"></span>`;
    row.addEventListener("click", () => select(p.id));
    bindHover(row, ev => progTip(ev, p));
    list.appendChild(row);
  });
}
function renderRanking() {
  const key = S.mode === "ppp" ? "ppp" : "postings";
  const rankKey = S.mode === "ppp" ? "rank" : "rank_baseline";
  const max = Math.max(...P.map(p => p[key]));
  document.querySelectorAll(".rrow").forEach(row => {
    const p = byId[row.dataset.id];
    const r = p[rankKey];
    row.style.transform = `translateY(${(r - 1) * ROW_H}px)`;
    row.classList.toggle("top", r <= 3);
    row.classList.toggle("sel", p.id === S.sel);
    row.querySelector(".rk").textContent = r;
    row.querySelector(".nm").textContent = name(p);
    row.querySelector(".fill").style.width = (p[key] / max * 100) + "%";
    row.querySelector(".val").textContent = S.mode === "ppp" ? fmt(p.ppp, 2) : fmt(p.postings);
  });
  $("rankNote").innerHTML = t(S.mode === "ppp" ? "note_ppp" : "note_raw");
}

// ---------- scatter ----------
function renderScatter() {
  const box = $("scatter");
  box.innerHTML = "";
  const W = box.clientWidth, H = Math.max(320, Math.min(440, W * 0.78));
  const m = { l: 56, r: 16, t: 10, b: 44 };
  const xs = [60, 10000], ys = [60, 30000];
  const lx = v => m.l + (Math.log10(v) - Math.log10(xs[0])) / (Math.log10(xs[1]) - Math.log10(xs[0])) * (W - m.l - m.r);
  const ly = v => H - m.b - (Math.log10(v) - Math.log10(ys[0])) / (Math.log10(ys[1]) - Math.log10(ys[0])) * (H - m.t - m.b);
  const svg = svgEl("svg", { width: W, height: H }, box);
  const clip = svgEl("clipPath", { id: "plotclip" }, svgEl("defs", {}, svg));
  svgEl("rect", { x: m.l, y: m.t, width: W - m.l - m.r, height: H - m.t - m.b }, clip);

  [100, 1000, 10000].forEach(v => {
    svgEl("line", { class: "gridline", x1: lx(v), x2: lx(v), y1: m.t, y2: H - m.b }, svg);
    svgEl("text", { class: "tick", x: lx(v), y: H - m.b + 16, "text-anchor": "middle" }, svg).textContent = fmt(v);
  });
  [100, 1000, 10000].forEach(v => {
    svgEl("line", { class: "gridline", x1: m.l, x2: W - m.r, y1: ly(v), y2: ly(v) }, svg);
    svgEl("text", { class: "tick", x: m.l - 8, y: ly(v) + 4, "text-anchor": "end" }, svg).textContent = fmt(v);
  });
  svgEl("text", { class: "axis-title", x: (W + m.l) / 2, y: H - 6, "text-anchor": "middle" }, svg).textContent = t("ax_places");
  svgEl("text", { class: "axis-title", transform: `translate(14 ${(H - m.b + m.t) / 2}) rotate(-90)`, "text-anchor": "middle" }, svg).textContent = t("ax_postings");

  const g = svgEl("g", { "clip-path": "url(#plotclip)" }, svg);
  [1, 2, 4].forEach(k => {
    svgEl("line", { class: "refline", x1: lx(xs[0]), y1: ly(xs[0] * k), x2: lx(xs[1]), y2: ly(xs[1] * k) }, g);
    const x0 = { 1: 3000, 2: 2000, 4: 1500 }[k];
    const angle = Math.atan2(ly(x0 * 2 * k) - ly(x0 * k), lx(x0 * 2) - lx(x0)) * 180 / Math.PI;
    svgEl("text", { class: "reflabel", transform: `translate(${lx(x0)} ${ly(x0 * k)}) rotate(${angle}) translate(0 13)` }, svg).textContent = t("ref")(k);
  });

  const rad = p => 4 + 2.1 * Math.sqrt(p.applicants);
  const sorted = [...P].sort((a, b) => b.applicants - a.applicants);
  sorted.forEach(p => {
    const c = svgEl("circle", { class: "dot" + (p.id === S.sel ? " sel" : ""), cx: lx(p.places), cy: ly(p.postings), r: rad(p) }, svg);
    c.addEventListener("click", () => select(p.id));
    bindHover(c, ev => progTip(ev, p));
  });
  P.forEach(p => {
    const x = lx(p.places), y = ly(p.postings), r = rad(p);
    const left = p.places > 3000 || p.id === "Odontologi";
    const below = ["Klinisk ernæring", "Ergoterapi"].includes(p.id);
    const lab = svgEl("text", {
      class: "dotlabel" + (p.id === S.sel ? " sel" : ""),
      x: left ? x - r - 5 : x + r + (below ? -2 : 5), y: below ? y + r + 11 : y + 4, "text-anchor": left ? "end" : "start",
    }, svg);
    lab.textContent = name(p);
  });
}

// ---------- profile ----------
function renderSelect() {
  $("progSelect").innerHTML = P.map(p => `<option value="${esc(p.id)}">${p.rank}. ${esc(name(p))}</option>`).join("");
  $("progSelect").value = S.sel;
}
function renderProfile() {
  const p = byId[S.sel];
  const stats = [
    [t("st_rank"), `${p.rank} / ${P.length}`], [t("st_ppp"), fmt(p.ppp, 2)], [t("st_app"), fmt(p.applicants, 2)],
    [t("st_full"), pct(p.fulltime)], [t("st_temp"), pct(p.temporary)],
  ];
  $("stats").innerHTML = stats.map(([l, v]) => `<div class="stat"><div class="label">${esc(l)}</div><div class="value">${esc(v)}</div></div>`).join("");
  $("warn").innerHTML = p.n_snapshot < 50 ? `<div class="warn">${esc(t("warn")(p.n_snapshot))}</div>` : "";

  // skills
  const relColor = { essential: "var(--s1)", optional: "var(--s2)", none: "var(--neutral)" };
  $("skLegend").innerHTML = ["essential", "optional", "none"]
    .filter(r => !(S.onlyEsco && r === "none"))
    .map(r => `<span><i style="background:${relColor[r]}"></i>${esc(t("rel_" + r))}</span>`).join("");
  let sk = DATA.skills[p.id] || [];
  if (S.onlyEsco) sk = sk.filter(s => s.rel !== "none");
  sk = sk.slice(0, 15);
  const max = Math.max(0.01, ...sk.map(s => s.share));
  const skBox = $("skills");
  skBox.innerHTML = "";
  sk.forEach(s => {
    const row = document.createElement("div");
    row.className = "hb";
    const label = s.en;
    row.innerHTML = `<span class="lab">${esc(label)}</span><div><div class="bar" style="width:0;background:${relColor[s.rel]}"></div></div><span class="num">${pct(s.share)}</span>`;
    bindHover(row, ev => showTip(ev, label, [
      [t("tt_share"), pct(s.share)], [t("tt_n"), fmt(s.n)], ["ESCO", t("rel_" + s.rel)],
      ["ESCO (Norwegian)", s.no],
    ]));
    skBox.appendChild(row);
    requestAnimationFrame(() => { row.querySelector(".bar").style.width = (s.share / max * 100) + "%"; });
  });

  // counties
  const co = Object.entries(DATA.counties[p.id] || {}).sort((a, b) => b[1] - a[1]);
  const total = co.reduce((s, [, n]) => s + n, 0);
  $("coSub").textContent = t("co_sub")(fmt(total));
  const cmax = Math.max(1, ...co.map(c => c[1]));
  $("counties").innerHTML = co.map(([c, n]) =>
    `<div class="hb county"><span class="lab">${esc(c)}</span><div><div class="bar" style="width:${n / cmax * 100}%"></div></div><span class="num">${fmt(n)}</span></div>`).join("");
}

// ---------- slope ----------
function renderSlope() {
  const box = $("slope");
  box.innerHTML = "";
  const W = box.clientWidth, rowH = 26, H = P.length * rowH + 30;
  const labW = Math.min(150, W * 0.36);
  const x1 = labW + 6, x2 = W - labW - 6;
  const y = r => 28 + (r - 1) * rowH;
  const svg = svgEl("svg", { width: W, height: H }, box);
  svgEl("text", { class: "axis-title", x: x1, y: 10, "text-anchor": "middle" }, svg).textContent = t("sl_left");
  svgEl("text", { class: "axis-title", x: x2, y: 10, "text-anchor": "middle" }, svg).textContent = t("sl_right");
  const ordered = [...P].sort((a, b) => (a.id === S.sel) - (b.id === S.sel));
  ordered.forEach(p => {
    const sel = p.id === S.sel ? " sel" : "";
    svgEl("line", { class: "slope" + sel, x1, y1: y(p.rank_baseline), x2, y2: y(p.rank) }, svg);
  });
  ordered.forEach(p => {
    const sel = p.id === S.sel ? " sel" : "";
    svgEl("circle", { class: "sdot" + sel, cx: x1, cy: y(p.rank_baseline), r: 4.5 }, svg);
    svgEl("circle", { class: "sdot" + sel, cx: x2, cy: y(p.rank), r: 4.5 }, svg);
    const l = svgEl("text", { class: "slabel" + sel, x: x1 - 10, y: y(p.rank_baseline) + 4, "text-anchor": "end" }, svg);
    l.textContent = `${name(p)} ${p.rank_baseline}`;
    const r = svgEl("text", { class: "slabel" + sel, x: x2 + 10, y: y(p.rank) + 4 }, svg);
    r.textContent = `${p.rank} ${name(p)}`;
    [l, r].forEach(el => fitText(el, labW - 8));
  });
  // hit areas: one band per programme on each side
  P.forEach(p => {
    [[0, y(p.rank_baseline)], [x2, y(p.rank)]].forEach(([x, cy]) => {
      const h = svgEl("rect", { class: "hit", x, y: cy - rowH / 2, width: x === 0 ? x1 + 8 : W - x2, height: rowH }, svg);
      h.addEventListener("click", () => select(p.id));
      bindHover(h, ev => showTip(ev, name(p), [[t("tt_rank_b"), p.rank_baseline], [t("tt_rank_m"), p.rank]]));
    });
  });
}
function fitText(el, maxW) {
  let s = el.textContent;
  while (el.getComputedTextLength() > maxW && s.length > 4) {
    s = s.slice(0, -1);
    el.textContent = s.trimEnd() + "…";
  }
}

// ---------- robustness ----------
const VARIANTS = ["main", "title_only", "snapshot", "permanent", "fulltime"];
function renderRob() {
  const head = `<tr><th></th>${t("rb_cols").map(c => `<th>${c}</th>`).join("")}</tr>`;
  const rows = P.map(p => `<tr data-id="${esc(p.id)}" class="${p.id === S.sel ? "sel" : ""}"><td title="${esc(name(p))}">${esc(name(p))}</td>${
    VARIANTS.map(v => { const r = p.ranks[v]; return `<td class="${r <= 3 ? "top" : ""}">${r}</td>`; }).join("")}</tr>`).join("");
  $("rob").innerHTML = head + rows;
  $("rob").querySelectorAll("tr[data-id]").forEach(tr => tr.addEventListener("click", () => select(tr.dataset.id)));
}

// ---------- precision / recall ----------
function renderPR() {
  const ev = DATA.eval.skills;
  const methods = [["baseline", t("m_base"), "var(--s2)"], ["llm", t("m_llm"), "var(--s1)"]];
  $("prLegend").innerHTML = methods.map(([, l, c]) => `<span><i style="background:${c}"></i>${esc(l)}</span>`).join("");
  $("pr").innerHTML = ["precision", "recall"].map(k => `<div class="grp"><div>${esc(t(k))}</div>${
    methods.map(([m, l, c]) => `<div class="hb"><span class="lab">${esc(l)}</span><div><div class="bar" style="width:${ev[m][k] * 100}%;background:${c}"></div></div><span class="num">${fmt(ev[m][k], 2)}</span></div>`).join("")
  }</div>`).join("");
}

// ---------- wiring ----------
function select(id) {
  S.sel = id;
  $("progSelect").value = id;
  renderRanking(); renderScatter(); renderProfile(); renderSlope(); renderRob();
}
function renderAll() {
  renderText(); renderKpis(); renderRanking(); renderScatter(); renderSelect();
  renderProfile(); renderSlope(); renderRob(); renderPR();
}

document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => {
  S.mode = b.dataset.mode; renderText(); renderRanking();
}));
$("themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  renderText();
});
$("progSelect").addEventListener("change", e => select(e.target.value));
$("onlyEsco").addEventListener("change", e => { S.onlyEsco = e.target.checked; renderProfile(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const i = P.findIndex(p => p.id === S.sel) + (e.key === "ArrowDown" ? 1 : -1);
    if (i >= 0 && i < P.length) { e.preventDefault(); select(P[i].id); }
  }
});
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderScatter(); renderSlope(); }, 120); });

buildRanking();
renderAll();
</script>
</body>
